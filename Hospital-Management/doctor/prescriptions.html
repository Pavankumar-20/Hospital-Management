<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prescriptions | Doctor Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><a href="../index.html" class="sidebar-logo"><i class="fas fa-heart-pulse"></i><span>MediCare+</span></a><button class="sidebar-close"><i class="fas fa-times"></i></button></div>
      <div class="sidebar-user"><div class="sidebar-user-avatar"><img src="https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=100&h=100&fit=crop" alt="Doctor"></div><div class="sidebar-user-info"><h5>Doctor</h5><span>Doctor</span></div></div>
      <nav class="sidebar-nav">
        <div class="sidebar-nav-section"><p class="sidebar-nav-title">Main Menu</p>
          <a href="dashboard.html" class="sidebar-link"><i class="fas fa-th-large"></i> Dashboard</a>
          <a href="appointments.html" class="sidebar-link"><i class="fas fa-calendar-check"></i> Appointments</a>
          <a href="patients.html" class="sidebar-link"><i class="fas fa-users"></i> Patients</a>
          <a href="prescriptions.html" class="sidebar-link active"><i class="fas fa-prescription-bottle-medical"></i> Prescriptions</a>
        </div>
        <div class="sidebar-nav-section"><p class="sidebar-nav-title">Account</p>
          <a href="profile.html" class="sidebar-link"><i class="fas fa-user"></i> Profile</a>
          <a href="settings.html" class="sidebar-link"><i class="fas fa-cog"></i> Settings</a>
        </div>
      </nav>
      <div class="sidebar-footer"><a href="#" class="sidebar-link logout logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a></div>
    </aside>

    <main class="dashboard-main">
      <header class="dashboard-header">
        <div class="dashboard-header-left"><button class="sidebar-toggle"><i class="fas fa-bars"></i></button></div>
        <div class="dashboard-header-right"><button class="theme-toggle header-action"><i class="fas fa-moon"></i></button><button class="btn btn-primary btn-sm" data-modal="prescriptionModal"><i class="fas fa-plus"></i> New Prescription</button></div>
      </header>

      <div class="dashboard-content">
        <div class="page-title-bar"><h1>Prescriptions</h1><p>Write and manage patient prescriptions</p></div>
        <div class="dashboard-card"><div class="dashboard-card-body"><p class="text-muted">Use the button above to write a new prescription after completing an appointment.</p></div></div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="prescriptionModal">
    <div class="modal">
      <div class="modal-header"><h3>Write Prescription</h3><button class="modal-close"><i class="fas fa-times"></i></button></div>
      <form id="prescriptionForm">
        <div class="modal-body">
          <div class="form-group"><label class="form-label required">Patient Name</label><input type="text" class="form-control" name="patientName" required></div>
          <div id="medicinesContainer">
            <div class="form-row medicine-row">
              <div class="form-group"><label class="form-label">Medicine Name</label><input type="text" class="form-control" name="medicine1" required></div>
              <div class="form-group"><label class="form-label">Dosage</label><input type="text" class="form-control" name="dosage1" placeholder="e.g., 1 tablet twice daily" required></div>
              <div class="form-group"><label class="form-label">Duration</label><input type="text" class="form-control" name="duration1" placeholder="e.g., 7 days" required></div>
            </div>
          </div>
          <button type="button" class="btn btn-outline btn-sm" id="addMedicine"><i class="fas fa-plus"></i> Add Medicine</button>
          <div class="form-group" style="margin-top:1rem;"><label class="form-label">Notes</label><textarea class="form-control" name="notes" rows="2"></textarea></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-outline" data-close-modal>Cancel</button><button type="submit" class="btn btn-primary">Save Prescription</button></div>
      </form>
    </div>
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/login.js"></script>
  <script src="../js/dashboard.js"></script>
  <script src="../js/doctor.js"></script>
</body>
</html>
