<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | MediCare Plus</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg-shapes">
      <div class="auth-shape auth-shape-1"></div>
      <div class="auth-shape auth-shape-2"></div>
    </div>

    <a href="index.html" class="auth-back"><i class="fas fa-arrow-left"></i> Back to Home</a>

    <div class="auth-container register-container">
      <div class="auth-form-wrapper">
        <div class="auth-form-header">
          <div class="auth-brand-logo"><i class="fas fa-heart-pulse"></i> MediCare+</div>
          <h2>Create Account</h2>
          <p>Already have an account? <a href="login.html">Sign in here</a></p>
        </div>

        <form class="auth-form" id="registerForm">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label required">First Name</label>
              <input type="text" class="form-control" name="firstName" placeholder="John">
            </div>
            <div class="form-group">
              <label class="form-label required">Last Name</label>
              <input type="text" class="form-control" name="lastName" placeholder="Doe">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label required">Email Address</label>
            <div class="input-group">
              <i class="fas fa-envelope input-group-icon"></i>
              <input type="email" class="form-control has-icon" name="email" placeholder="john@email.com">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label required">Phone Number</label>
            <div class="input-group">
              <i class="fas fa-phone input-group-icon"></i>
              <input type="tel" class="form-control has-icon" name="phone" placeholder="+1 (555) 000-0000">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label required">Password</label>
              <div class="input-group">
                <i class="fas fa-lock input-group-icon"></i>
                <input type="password" class="form-control has-icon has-action" name="password" placeholder="Create password">
                <button type="button" class="input-group-action password-toggle"><i class="fas fa-eye"></i></button>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label required">Confirm Password</label>
              <div class="input-group">
                <i class="fas fa-lock input-group-icon"></i>
                <input type="password" class="form-control has-icon" name="confirmPassword" placeholder="Confirm password">
              </div>
            </div>
          </div>

          <div class="form-group">
            <label class="custom-checkbox">
              <input type="checkbox" id="terms" name="terms">
              <span class="checkmark"><i class="fas fa-check"></i></span>
              <span class="form-check-label">I agree to the <a href="#" class="text-primary">Terms of Service</a> and <a href="#" class="text-primary">Privacy Policy</a></span>
            </label>
          </div>

          <button type="submit" class="btn btn-emerald"><i class="fas fa-user-plus"></i> Create Account</button>
        </form>
      </div>
    </div>
  </div>

  <button class="theme-toggle" style="position:fixed;top:2rem;right:2rem;z-index:100;"><i class="fas fa-moon"></i></button>

  <script src="js/theme.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
